name: Test suite

on:
  # Every pull request, whatever it targets (stacked PRs target other branches).
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pillow: taos-camerad imports PIL at module level, and its tests load it.
      - name: Install test dependencies
        run: pip install pytest pillow
      - name: Run test suite
        run: python3 -m pytest -q -p no:cacheprovider pmos