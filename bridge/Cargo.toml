[package]
name = "taosd-bridge"
version = "0.1.0"
edition = "2021"
description = "taOS hardware bridge for Ubuntu Touch: exposes SMS, dialing and battery as cluster capabilities"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zbus = "5"

[dev-dependencies]
tempfile = "3"
