# Replace the Lomiri shell with the taOS kiosk, in place.
#
# Masking lomiri-full-greeter.service does not work: the session then has no
# main process, lightdm treats the session as over and falls back to its own
# greeter (lomiri-greeter, running as the lightdm user) — which puts the shell
# and its top bar right back on screen.
#
# Overriding ExecStart keeps the session structure lightdm expects while
# changing what actually renders.
[Service]
ExecStart=
ExecStart=/home/phablet/bin/taos-kiosk-mir.sh
