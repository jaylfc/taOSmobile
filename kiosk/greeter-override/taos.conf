# Run the taOS QML shell in place of Lomiri.
#
# Overriding ExecStart (rather than masking the unit) is essential: a masked
# unit leaves the session with no main process, so lightdm starts its own
# greeter as the lightdm user and Lomiri — with its top bar — comes back.
[Service]
ExecStart=
ExecStart=/home/phablet/bin/taos-qml-shell.sh
