# Use case configuration for Nothing Phone (1)

Syntax 4

SectionUseCase."HiFi" {
	File "/Nothing/spacewar/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"

# The WCD9385 codec is only present in the device tree on kernels that carry
# the wcd938x/SoundWire/LPASS-macro nodes. Without it none of these controls
# exist, and an unconditional BootSequence makes the whole profile fail to
# open -- which leaves the card with no usable profile at all, even though the
# speaker path (q6afe PRI_MI2S_RX -> tfa9873) needs none of it.
If.wcd938x {
	Condition {
		Type ControlExists
		Control "name='HPHL Volume'"
	}
	True {
		BootSequence [
			cset "name='HPHL Volume' 20"
			cset "name='HPHR Volume' 20"
			cset "name='ADC1 Volume' 12"
			cset "name='ADC2 Volume' 12"
			cset "name='ADC4 Volume' 12"
			cset "name='ADC4 Volume' 12"
		]

		Include.wcd-init.File "/codecs/wcd938x/init.conf"
	}
}
