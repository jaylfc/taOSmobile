# Keep plymouthd alive on spacewar.
#
# plymouthd 26.134.222-r1 (Alpine edge/community) segfaults in main() with
#   strcmp(NULL, "ttynull")
# because ply_get_primary_kernel_console_type() returns NULL and the result is
# compared without a NULL check. It returns NULL here because this device has
# no active console at all: /sys/class/tty/console/active is zero bytes
# (the cmdline asks for console=ttyMSM8, which never materialises).
#
# The guarding condition in main() is
#   has_argument("plymouth.graphical") || strcmp(console_type(), "ttynull") == 0
# so naming this argument short-circuits the || and the NULL deref is never
# reached. Both branch targets were disassembled before relying on this: the
# argument path only sets a flag bit and falls through into the same code the
# normal path runs, so this changes no behaviour beyond not crashing.
#
# It is also what we mean: there is no text console, so go graphical.
#
# REMOVE THIS once Alpine ships a plymouth with the NULL check. It is a
# workaround for an upstream bug, not a setting we want.
plymouth.graphical
