# taOS display settings for this device. Parsed, not sourced: KEY=VALUE only.
#
# SCREEN_OFF_SECONDS: seconds without input before the panel powers off and the
# phone locks. 5 to 3600, or 0 for never. Read by taos-kiosk-idle at start;
# apply a change with: swaymsg exec /usr/local/bin/taos-kiosk-idle
SCREEN_OFF_SECONDS=60
