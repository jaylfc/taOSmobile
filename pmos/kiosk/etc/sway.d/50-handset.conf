# Handset lines for the taOS kiosk session. The generic config
# (/etc/taos/sway-kiosk.conf, from taOS session/) includes /etc/taos/sway.d/*.conf;
# this file is what makes it a phone: panel wake, sensors, charger, and the
# power and volume keys.

# Touch device: there is no mouse, so never paint a pointer.
seat * hide_cursor 1

# Double-tap the dark screen to wake it. Started here rather than as a system
# unit so it inherits SWAYSOCK from the session -- it talks to the compositor,
# so it has to live inside it, the same reason the idle watcher does.
# exec_always, so a `swaymsg reload` replaces it instead of leaving two daemons
# racing to wake the same panel; the script drops any previous instance itself.
exec_always /usr/local/bin/taos-kiosk-dt2w-run

# Hold a claim on the light/proximity sensors so their readings stay LIVE.
# iio-sensor-proxy only polls a sensor while something has claimed it, and the
# volume keys' pocket gate reads proximity at press time -- a stale "not near"
# would let every pocket press through. See taos-sensord.
exec_always /usr/local/bin/taos-sensord

# Charger plugged in -> wake + the lock screen's charging animation. Lives in
# the session for SWAYSOCK, like the watchers above; exec_always so a reload
# replaces it (the script drops its previous instance by PID itself).
exec_always /usr/local/bin/taos-kiosk-charger

### Power key ################################################################
# logind is left at the image's stock HandlePowerKey=ignore ON PURPOSE: writing
# a logind config that this image deliberately ships without previously made a
# short press shut the phone down even inside KDE. The compositor owns the key
# instead, exactly as powerdevil owns it under Plasma.
# --locked so it still works while the display is off. The toggle is a script
# because sway refuses `power toggle` against the `*` wildcard -- see it.
# TAP = screen on/off, HOLD 1.5s = power menu (Jay's spec). The press arm starts
# a timer, the release arm races it; taos-kiosk-power-hold explains the marker
# that makes that race have exactly one winner. --no-repeat so holding the key
# does not fire `press` over and over as key autorepeat kicks in.
bindsym --locked --no-repeat XF86PowerOff exec /usr/local/bin/taos-kiosk-power-hold press
bindsym --locked --release XF86PowerOff exec /usr/local/bin/taos-kiosk-power-hold release
# Belt and braces: if this panel's power key does not resolve to the
# XF86PowerOff keysym, bind the raw evdev code instead. KEY_POWER is 116 and
# Wayland keycodes are evdev + 8, hence 124. Harmless when redundant.
bindcode --locked --no-repeat 124 exec /usr/local/bin/taos-kiosk-power-hold press
bindcode --locked --release 124 exec /usr/local/bin/taos-kiosk-power-hold release

### Volume keys ##############################################################
# Reported to the page, which owns the behaviour -- see taos-kiosk-volume for
# why the decision is not split across two places.
#
# --locked so they work while the display is off, and --no-repeat because key
# autorepeat while the rocker is held would otherwise look like a burst of
# separate presses; the HOLD is detected from press-to-release timing instead.
#
# Keysym AND keycode, the same belt-and-braces the power key uses: evdev
# KEY_VOLUMEUP is 115 and KEY_VOLUMEDOWN 114, and Wayland keycodes are evdev + 8
# (123 and 122). Measured from /proc/bus/input/devices: vol-up is gpio-keys,
# vol-down is pmic_resin, and the headset jack reports both -- which is exactly
# why these bind the keysym rather than a device.
bindsym --locked --no-repeat XF86AudioRaiseVolume exec /usr/local/bin/taos-kiosk-volume up press
bindsym --locked --release   XF86AudioRaiseVolume exec /usr/local/bin/taos-kiosk-volume up release
bindsym --locked --no-repeat XF86AudioLowerVolume exec /usr/local/bin/taos-kiosk-volume down press
bindsym --locked --release   XF86AudioLowerVolume exec /usr/local/bin/taos-kiosk-volume down release
bindcode --locked --no-repeat 123 exec /usr/local/bin/taos-kiosk-volume up press
bindcode --locked --release   123 exec /usr/local/bin/taos-kiosk-volume up release
bindcode --locked --no-repeat 122 exec /usr/local/bin/taos-kiosk-volume down press
bindcode --locked --release   122 exec /usr/local/bin/taos-kiosk-volume down release
