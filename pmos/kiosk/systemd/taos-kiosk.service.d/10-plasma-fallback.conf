# Plasma Mobile is the handset's fallback session. taos-kiosk.service itself
# comes from taOS (session/systemd/) and knows nothing about it.
[Unit]
# Starting the kiosk STOPS Plasma Mobile: systemd resolves the conflict for us,
# so the switch is one `systemctl start` rather than a stop/start race.
# Conflicts= appends to the unit's own list.
Conflicts=plasma-mobile.service

# THE SAFETY PROPERTY: if the kiosk fails to start or dies, fall straight back
# to Plasma Mobile. A phone that boots to a black screen is unusable and the
# user has no terminal to recover with.
OnFailure=plasma-mobile.service
