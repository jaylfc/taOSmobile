# Handset drop-in for the waydroid-systemd package's unit, which is only
# BusName= plus ExecStart=/usr/bin/waydroid container start: no check, no
# stop command. Installed by pmos/waydroid/install-waydroid.sh.
[Unit]
Documentation=https://github.com/jaylfc/taOSmobile/tree/main/pmos/waydroid
# The firewall first: waydroid-net.sh adds its own `inet lxc` nft tables at
# container start, and /etc/nftables.nft begins with `flush ruleset`, so a
# firewall load AFTER the container would wipe them (and 51_waydroid.nft's
# accept lines are what lets the container's traffic through our policy-drop
# chains at all). A firewall reload while the container runs needs a container
# restart; the README says so.
After=nftables.service

[Service]
# Refuse on a kernel that cannot run the container, and re-apply the handset
# lxc lines. The script explains each check.
ExecStartPre=/usr/local/bin/taos-waydroid-check
# The stock unit has no ExecStop, so `systemctl stop` would SIGTERM the
# manager and leave lxc, the bridge and the loop mounts behind.
ExecStop=/usr/bin/waydroid container stop
ExecStopPost=/usr/bin/waydroid session stop
