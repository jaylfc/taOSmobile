# Handset lines appended to /var/lib/waydroid/lxc/waydroid/config by
# taos-waydroid-check before every container start (waydroid init/upgrade
# regenerate that file, so they cannot live in it).
#
# No block devices inside Android. Waydroid loop-mounts system.img and
# vendor.img on the host, so the container has no need of a block node, and
# the handset's UFS partitions (xbl, abl, the GPT) are the one thing nothing
# on this phone may ever write. The cgroup2 device controller enforces it.
#
# LXC's cgroup2 device filter is an eBPF ALLOWLIST once any devices rule is
# present: with the deny line alone, every char device was refused too and
# Android's init exited at once ("Can't open /dev/null", measured on the
# handset 2026-10-31; no rule = RUNNING, allow c + deny b = RUNNING). So the
# char allow comes first and the block deny stays explicit.
lxc.cgroup2.devices.allow = c *:* rwm
lxc.cgroup2.devices.deny = b *:* rwm
