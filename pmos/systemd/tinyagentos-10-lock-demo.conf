[Service]
# Demo placeholders for the lock-screen agent islands. Quoted because the value
# contains spaces: unquoted, systemd splits on whitespace and drops the value.
# Format per entry: Name:framework:status text
Environment="TAOS_LOCK_DEMO_AGENTS=Personal Assistant:hermes:Planning tomorrow's schedule,Social Media Manager:openclaw:Scheduling 3 posts,Accountant:deepseek:Reconciling September invoices,Sales Manager:grok:Following up 4 leads,Customer Service:openai:Clearing the support inbox"

# The notification stacks. OFF by default in taOS and gated on BOTH flags, so
# clearing TAOS_LOCK_DEMO_AGENTS above still takes down everything invented on
# this screen in one move.
#
# EVERYTHING HERE IS SCRIPTED, SERVER-SIDE DEMO CONTENT, and it has to stay that
# way: the lock screen renders BEFORE sign-in, so whoever picks the handset up
# can read it. There is no code path from these stacks to a real inbox, and
# wiring one in would be a pre-auth leak rather than a feature.
Environment="TAOS_LOCK_DEMO_NOTIFICATIONS=1"

# The scripted phone / mailbox / apps / projects panels, and the pending
# decisions that ride at the top of Alerts. Same two-flag shape and the same
# rule as the stacks above: this content is invented, it is server-side, and
# there is no path from any of it to a real account. Clearing
# TAOS_LOCK_DEMO_AGENTS still takes the whole lot down in one move.
Environment="TAOS_LOCK_DEMO_PANELS=1"

# DEVICE AGENTS: a physical board (taOSusb) that appears on the lock screen
# while it is plugged in. Jay's demo, built with @taOS-dev.
#
# ⚠ THIS ONE IS NOT LIKE THE OTHERS. The flags above add invented content to a
# read-only screen. This one opens a path from a PRE-AUTH surface to a real
# command running on real hardware -- someone holding the locked phone can ask
# the board to do things. It therefore has its OWN flag, so turning the
# scripted demo on can never turn this on as a side effect, and it stays off
# on any device that is not being demoed.
Environment="TAOS_LOCK_DEMO_DEVICE_AGENTS=1"

# The pairing token, in a FILE rather than here: an Environment= value is
# readable in /proc/<pid>/environ by anything running as this user, and this
# token is the only thing between "someone on the Wi-Fi" and an island on a
# locked phone. 0600 taos:taos, generated at provisioning, never in the repo.
Environment="TAOS_DEVICE_AGENT_TOKEN_FILE=/etc/taos/device-agent.token"

# THE INCOMING CALL: a scripted call from Naira that the PA takes a message
# for, triggered from the demo board. Its own flag, like the others; there is
# no phone line behind it and nothing it does reaches a real calendar.
Environment="TAOS_LOCK_DEMO_CALL=1"
