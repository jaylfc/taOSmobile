[Service]
# Demo placeholders for the lock-screen agent islands. Quoted because the value
# contains spaces: unquoted, systemd splits on whitespace and drops the value.
# Format per entry: Name:framework:status text
Environment="TAOS_LOCK_DEMO_AGENTS=Personal Assistant:hermes:Drafting your morning brief,Social Media Manager:openclaw:Scheduling 3 posts,Accountant:deepseek:Reconciling September invoices,Sales Manager:grok:Following up 4 leads,Customer Service:openai:Clearing the support inbox"

# The notification stacks. OFF by default in taOS and gated on BOTH flags, so
# clearing TAOS_LOCK_DEMO_AGENTS above still takes down everything invented on
# this screen in one move.
#
# EVERYTHING HERE IS SCRIPTED, SERVER-SIDE DEMO CONTENT, and it has to stay that
# way: the lock screen renders BEFORE sign-in, so whoever picks the handset up
# can read it. There is no code path from these stacks to a real inbox, and
# wiring one in would be a pre-auth leak rather than a feature.
Environment="TAOS_LOCK_DEMO_NOTIFICATIONS=1"

# The scripted phone / mailbox / apps / projects panels, and the pending
# decisions that ride at the top of Alerts. Same two-flag shape and the same
# rule as the stacks above: this content is invented, it is server-side, and
# there is no path from any of it to a real account. Clearing
# TAOS_LOCK_DEMO_AGENTS still takes the whole lot down in one move.
Environment="TAOS_LOCK_DEMO_PANELS=1"
