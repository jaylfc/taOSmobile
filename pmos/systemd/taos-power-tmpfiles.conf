# The drop box the lock screen's power menu writes into.
#
# 0700 and owned by taos: anything that can write here can power the handset
# off, so that is the controller and root and nobody else. Under /run so it is
# tmpfs and cannot survive a reboot -- a stale request outliving a boot would
# power the phone off the moment it came back up.
d /run/taos-power 0700 taos taos -
